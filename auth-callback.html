<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #24142e;
        color: #dfe;
        font: 22px/1.35 "VT323", ui-monospace, monospace;
      }
      p {
        max-width: 28rem;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p id="m">Completing sign-in…</p>
    <script>
      (function () {
        var m = document.getElementById("m");
        var p = new URLSearchParams(window.location.search);
        function note(t) {
          if (m) m.textContent = t;
        }
        var at = p.get("access_token");
        if (!at || at.length < 8) {
          note(
            'No OAuth token returned. Ensure Google OAuth is configured in Butterbase or try "Continue with Google" again.'
          );
          return;
        }
        try {
          var rawExp = Number(p.get("expires_in"));
          var entry = {
            access_token: at,
            refresh_token: p.get("refresh_token"),
            token_type: p.get("token_type") || "Bearer",
            expires_at_ms:
              Number.isFinite(rawExp) && rawExp > 0
                ? Date.now() + rawExp * 1000
                : 0,
            stored_at: Date.now(),
          };
          window.localStorage.setItem(
            "starfall_bb_cloud_auth_v1",
            JSON.stringify(entry)
          );
        } catch (e) {
          note("Could not store tokens in this browser.");
          return;
        }
        var path = window.location.pathname;
        var cut = path.lastIndexOf("/");
        var folder = cut >= 0 ? path.slice(0, cut + 1) : "/";
        window.location.replace(
          window.location.origin + folder + "index.html"
        );
      })();
    </script>
  </body>
</html>
